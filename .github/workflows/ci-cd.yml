name: CI/CD — SmartPet Frontend

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  # ===========================================================================
  # 1. Integración Continua (CI): Lint y Build de TypeScript + Vite
  # ===========================================================================
  ci:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar linter (ESLint)
        run: npm run lint

      - name: Compilar aplicación (TypeScript + Vite Build)
        run: npm run build

  # ===========================================================================
  # 2. Despliegue Continuo (CD): Despliegue con Docker Compose en AWS EC2
  # ===========================================================================
  cd:
    name: Deploy to AWS EC2 (Docker + Nginx)
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_EC2_HOST: ${{ secrets.EC2_HOST != '' }}

    steps:
      - name: Aviso si aún no se configuraron los Secrets de EC2
        if: env.HAS_EC2_HOST != 'true'
        run: |
          echo "::notice::Secrets de EC2 (EC2_HOST, EC2_USER, EC2_SSH_KEY) aún no configurados en GitHub. Omitiendo despliegue SSH."

      - name: Desplegar en AWS EC2 vía SSH y Docker Compose
        if: env.HAS_EC2_HOST == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            cd ${{ secrets.EC2_APP_PATH || '~/SmartPet_Front' }}
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f
