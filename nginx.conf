server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para optimizar carga de JS/CSS
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Cache largo para assets versionados por Vite (/assets/*)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Soporte SPA para React Router (/login, /admin/login, /admin/pets, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
